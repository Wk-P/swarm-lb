[project]
name = "swarm-lb"
version = "0.8.0"
description = "Raspberry Pi Docker Swarm task load-balancing experiments"
readme = "README.md"
# manager 系统 Python 是 3.11.2；锁在 3.11 保证 Windows 与 Pi 解析一致
requires-python = "==3.11.*"

# 不设公共依赖：按"代码在哪运行"分组安装（一份 uv.lock）
#   集群宿主机 manager：uv sync --no-default-groups --group host --group algo --group ui   （deploy_host.py 自动执行）
#   集群外客户端机器：  uv sync --no-default-groups --group client
#   开发机：            uv sync --all-groups
#   docker 镜像（image/worker-app/）有自己的 pyproject，不在这里
#   节点 agent（ops/cluster/agent/）只用标准库
dependencies = []

[dependency-groups]
# host/manager/：8082 / 8084 采集器等常驻服务。版本与原 ~/apps/manager_server/.venv 线上一致
host = [
    "aiohttp==3.11.6",
    "docker==7.1.0",
    "paramiko==3.5.0",
    "pandas==3.0.1",
]
# ops/cluster/ui/：运维界面
ui = [
    "aiohttp==3.11.6",
    "docker==7.1.0",
]
# 8080/8081 调度器（scheduler_single.py、scheduler_batch.py）及 algorithms/、model/ 所需（DQN、gurobi、xgboost 预测）
algo = [
    "numpy==2.1.3",
    "joblib==1.4.2",
    "torch==2.5.1",
    "gurobipy==12.0.0",
    "scipy==1.14.1",
    "scikit-learn==1.8.0",
    "xgboost==2.1.2",
    "matplotlib==3.9.2",
]
# clients/load-client/：集群外发请求的客户端
client = [
    "aiohttp==3.11.6",
    "requests==2.32.3",
    "psutil",
]

[tool.uv]
package = false
# 不带参数的 uv sync（开发机）装除 algo 以外的全部；manager 由 deploy_host.py 显式指定分组
default-groups = ["host", "ui", "client"]
