# swarm-lb 资源登记表 —— "什么跑在哪、端口归谁" 的唯一来源
# 运维界面 (ops/) 和部署脚本 (deploy/deploy-manager.sh) 都读这个文件。
#
# owner:
#   ours    我们的。运维界面可启停/重启；deploy 脚本会安装其 unit
#   others  别人的。只读展示，任何脚本都不得修改其 unit / venv / 代码目录
#   unknown 归属未确认。只读展示

[cluster]
stack = "collect_data_stack"
image = "soar009/collect_data_app:v8"
manager_ip = "x.x.x.x"

[[node]]
name = "manager"
ssh = "Manager-Node"
ip = "x.x.x.x"
role = "manager"
label = ""

[[node]]
name = "worker-01"
ssh = "Worker-Node-1"
ip = "x.x.x.x"
role = "worker"
label = "low"

[[node]]
name = "worker-02"
ssh = "Worker-Node-2"
ip = "x.x.x.x"
role = "worker"
label = "middle"

[[node]]
name = "worker-03"
ssh = "Worker-Node-3"
ip = "x.x.x.x"
role = "worker"
label = "high"

# ---------------- Manager-Node 上的 systemd 服务（按端口） ----------------

[[service]]
port = 80
unit = "swarm-lb-ops.service"
owner = "ours"
title = "运维管理界面"
script = "ops/server.py"
managed = true            # unit 文件在本仓库 deploy/systemd/，deploy 时安装
self = true               # 界面自身：不提供"停止"按钮

[[service]]
port = 8080
unit = "collect_8080.service"
owner = "ours"
title = "v8 manager_hmsw（DQN / direct / sd_min / min_min / RR）"
script = "manager/manager_hmsw.py"
managed = true
status_path = ""
note = "开机不自启。manager_hmsw8d.py / manager_hmsw_collect.py 也写死 8080，不能同时运行"

[[service]]
port = 8081
unit = "collect_8081.service"
owner = "others"
title = "manager_hmsw_v2（RL_MOTS / Ablation / algor_set）"
script = "~/appv8/manager/manager_hmsw_v2.py"
note = "他人使用，勿动。仍用 ~/apps/manager_server/.venv + ~/appv8"

[[service]]
port = 8082
unit = "collect_8082_rr.service"
owner = "ours"
title = "v8 XGB 数据采集 · Round Robin"
script = "manager/manager_xgbdata_collecter_rr.py"
managed = true
status_path = "/queue/status"
note = "manager_xgbdata_collecter.py 也写死 8082，不能同时运行"

[[service]]
port = 8083
unit = "collect_8083.service"
owner = "others"
title = "XGB 数据采集 · Least Time"
script = "~/appv8/manager/manager_xgbdata_collecter_lstt.py"
status_path = "/queue/status"
note = "按他人使用处理（待确认），勿动。仍用 ~/apps/manager_server/.venv + ~/appv8"

[[service]]
port = 8084
unit = "collect_8084.service"
owner = "ours"
title = "v8 XGB 数据采集 · handle_hdd v2（RR）"
script = "manager/manager_xgbdata_collector_handle_hdd_v2.py"
managed = true
status_path = "/queue/status"

[[service]]
port = 5000
unit = "log-viewer.service"
owner = "unknown"
title = "旧日志查看页（Flask，tail /var/log/manager_stdout.log）"
script = "~/daemon-page/log-check.py"
note = "看的是旧 manager-server 的日志，该服务已停用"

[[service]]
port = 8100
unit = "server_8100.service"
owner = "unknown"
title = "legacy server_8100"
script = "~/apps/manager_server/server_8100.py"
note = "已停用"

[[service]]
port = 0
unit = "manager-server.service"
owner = "unknown"
title = "legacy manager_node/main.py"
script = "~/apps/manager_server/manager_node/main.py"
note = "已停用"
