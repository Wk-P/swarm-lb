# swarm-lb 资源登记表 —— "什么跑在哪、端口归谁" 的唯一来源
# 运维界面 (ops/cluster/ui/) 和部署脚本 (ops/local/deploy-host.sh) 都读这个文件。
# ${VAR} 是环境参数（envs/<环境名>.env，部署后为 manager 上的 .env），运维界面加载时展开。
#
# owner：服务的使用者/负责人，直接写人名（如 "soar009"、"user01"），未确认写 "unknown"。只用于显示和操作提示。
# managed = true：unit 模板在 ops/cluster/systemd/，deploy 脚本安装它，运维界面可启停（不是 maintainer 的服务会二次确认）
# 没有 managed：unit 不归本仓库管，只读展示；owner 是 maintainer 时运维界面仍可启停

[cluster]
stack = "collect_data_stack"
image = "${DOCKER_IMAGE}"
manager_ip = "${MANAGER_IP}"
maintainer = "soar009"    # 本仓库的维护者：运维界面操作别人（owner ≠ maintainer）的服务时会二次确认
agent_port = 9100         # 每个节点上的监控 agent（ops/cluster/agent/node_agent.py，ops/local/deploy-agents.sh 部署）

[[node]]
name = "manager"
ssh = "${MANAGER_SSH}"
ip = "${MANAGER_IP}"
role = "manager"
label = ""

[[node]]
name = "worker-01"
ssh = "${WORKER1_SSH}"
ip = "${WORKER1_IP}"
role = "worker"
label = "low"

[[node]]
name = "worker-02"
ssh = "${WORKER2_SSH}"
ip = "${WORKER2_IP}"
role = "worker"
label = "middle"

[[node]]
name = "worker-03"
ssh = "${WORKER3_SSH}"
ip = "${WORKER3_IP}"
role = "worker"
label = "high"

# ---------------- manager 上的 systemd 服务（按端口） ----------------

[[service]]
port = 5000
unit = "swarm-lb-ops.service"
owner = "soar009"
title = "运维管理界面"
script = "ops/cluster/ui/server.py"
managed = true            # unit 模板在 ops/cluster/systemd/，deploy-host.sh 安装
self = true               # 界面自身：不提供"停止"按钮

[[service]]
port = 9100
unit = "swarm-lb-agent.service"
owner = "soar009"
title = "节点监控 agent"
script = "ops/cluster/agent/node_agent.py"
note = "所有节点都有一份（~/swarm-lb-agent/），由 ops/local/deploy-agents.sh 部署；这里只列 manager 本机这份"

[[service]]
port = 8080
unit = "collect_8080.service"
owner = "soar009"
title = "调度器（DQN / direct / sd_min / min_min / RR）"
script = "host/manager/p8080_sched.py"
managed = true
status_path = ""
note = "开机不自启"

[[service]]
port = 8081
unit = "collect_8081.service"
owner = "user01"
title = "调度器 v2（RL_MOTS / Ablation / algor_set）"
script = "host/manager/p8081_sched_v2.py"
managed = true
note = "user01 使用。2026-11-11 从 ~/appv8 迁入本仓库（代码与原版一致，仅 SSH 账号改读 .env）。改代码请改仓库后部署"

[[service]]
port = 8082
unit = "collect_8082.service"
owner = "soar009"
title = "v8 XGB 数据采集 · Round Robin"
script = "host/manager/p8082_collect_rr.py"
managed = true
status_path = "/queue/status"

[[service]]
port = 8083
unit = "collect_8083.service"
owner = "soar009"
title = "XGB 数据采集 · Least Time"
script = "host/manager/p8083_collect_lstt.py"
managed = true
status_path = "/queue/status"
note = "2026-11-11 从 ~/appv8 迁入本仓库（代码与原版一致，仅 SSH 账号改读 .env）"

[[service]]
port = 8084
unit = "collect_8084.service"
owner = "soar009"
title = "v8 XGB 数据采集 · handle_hdd v2（RR）"
script = "host/manager/p8084_collect_hdd_rr.py"
managed = true
status_path = "/queue/status"

# 已移除：log-viewer.service（旧 Flask 日志页，原占 5000，现 5000 归运维界面）
#   2026-11-04 停用并 disable，不要再启用（会抢 5000 端口）。
#   unit 备份 ~/swarm-bak/systemd/20261104-202648/，代码仍在 ~/daemon-page/，
#   旧日志归档 /mnt/udisk/archive/manager-server-logs-2025/

[[service]]
port = 8100
unit = "server_8100.service"
owner = "unknown"
title = "legacy server_8100"
script = "~/apps/manager_server/server_8100.py"
