# swarm-lb 资源登记表 —— "什么跑在哪、端口归谁" 的唯一来源
# 运维界面 (ops/cluster/ui/) 和部署脚本 (ops/local/deploy-host.sh) 都读这个文件。
# ${VAR} 是环境参数（envs/<环境名>.env，部署后为 manager 上的 .env），运维界面加载时展开。
#
# owner:
#   ours    soar009。运维界面可启停/重启；deploy 脚本会安装其 unit
#   others  别人的。只读展示，任何脚本都不得修改其 unit / venv / 代码目录
#   unknown 归属未确认。只读展示

[cluster]
stack = "collect_data_stack"
image = "${DOCKER_IMAGE}"
manager_ip = "${MANAGER_IP}"
agent_port = 9100         # 每个节点上的监控 agent（ops/cluster/agent/node_agent.py，ops/local/deploy-agents.sh 部署）

[[node]]
name = "manager"
ssh = "${MANAGER_SSH}"
ip = "${MANAGER_IP}"
role = "manager"
label = ""

[[node]]
name = "worker-01"
ssh = "${WORKER1_SSH}"
ip = "${WORKER1_IP}"
role = "worker"
label = "low"

[[node]]
name = "worker-02"
ssh = "${WORKER2_SSH}"
ip = "${WORKER2_IP}"
role = "worker"
label = "middle"

[[node]]
name = "worker-03"
ssh = "${WORKER3_SSH}"
ip = "${WORKER3_IP}"
role = "worker"
label = "high"

# ---------------- manager 上的 systemd 服务（按端口） ----------------

[[service]]
port = 5000
unit = "swarm-lb-ops.service"
owner = "ours"
title = "运维管理界面"
script = "ops/cluster/ui/server.py"
managed = true            # unit 模板在 ops/cluster/systemd/，deploy-host.sh 安装
self = true               # 界面自身：不提供"停止"按钮

[[service]]
port = 9100
unit = "swarm-lb-agent.service"
owner = "ours"
title = "节点监控 agent"
script = "ops/cluster/agent/node_agent.py"
note = "所有节点都有一份（~/swarm-lb-agent/），由 ops/local/deploy-agents.sh 部署；这里只列 manager 本机这份"

[[service]]
port = 8080
unit = "collect_8080.service"
owner = "ours"
title = "v8 manager_hmsw（DQN / direct / sd_min / min_min / RR）"
script = "host/manager/manager_hmsw.py"
managed = true
status_path = ""
note = "开机不自启。manager_hmsw8d.py / manager_hmsw_collect.py 也写死 8080，不能同时运行"

[[service]]
port = 8081
unit = "collect_8081.service"
owner = "others"
title = "manager_hmsw_v2（RL_MOTS / Ablation / algor_set）"
script = "~/appv8/manager/manager_hmsw_v2.py"
note = "他人使用，勿动。仍用 ~/apps/manager_server/.venv + ~/appv8"

[[service]]
port = 8082
unit = "collect_8082_rr.service"
owner = "ours"
title = "v8 XGB 数据采集 · Round Robin"
script = "host/manager/manager_xgbdata_collecter_rr.py"
managed = true
status_path = "/queue/status"
note = "manager_xgbdata_collecter.py 也写死 8082，不能同时运行"

[[service]]
port = 8083
unit = "collect_8083.service"
owner = "ours"
title = "XGB 数据采集 · Least Time"
script = "~/appv8/manager/manager_xgbdata_collecter_lstt.py"
status_path = "/queue/status"
note = "2026-11-04 确认归我们。unit 不在本仓库（未 managed），仍用 ~/apps/manager_server/.venv + ~/appv8"

[[service]]
port = 8084
unit = "collect_8084.service"
owner = "ours"
title = "v8 XGB 数据采集 · handle_hdd v2（RR）"
script = "host/manager/manager_xgbdata_collector_handle_hdd_v2.py"
managed = true
status_path = "/queue/status"

# 已移除：log-viewer.service（旧 Flask 日志页，原占 5000，现 5000 归运维界面）
#   2026-11-04 停用并 disable，不要再启用（会抢 5000 端口）。
#   unit 备份 ~/swarm-bak/systemd/20261104-202648/，代码仍在 ~/daemon-page/，
#   旧日志归档 /mnt/udisk/archive/manager-server-logs-2025/

[[service]]
port = 8100
unit = "server_8100.service"
owner = "unknown"
title = "legacy server_8100"
script = "~/apps/manager_server/server_8100.py"
note = "已停用"

[[service]]
port = 0
unit = "manager-server.service"
owner = "unknown"
title = "legacy manager_node/main.py"
script = "~/apps/manager_server/manager_node/main.py"
note = "已停用"
