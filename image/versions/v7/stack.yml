version: "3.8"

services:
  collect_data_app:
    image: soar009/collect_data_app:v7
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    networks:
      - collect_data_network
    

networks:
  collect_data_network:
    driver: overlay
